<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chốt đơn - Màn hình live</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#65676b; --accent:#e11d48; --ok:#16a34a; --warn:#d97706; --line:#e4e6eb; --chip:#fde7ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#18191a; --card:#242526; --text:#e4e6eb; --muted:#b0b3b8; --line:#3a3b3c; --chip:#4a1f2a; } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.35 system-ui,Arial,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header a { color:var(--accent); text-decoration:none; }
  header .stats { margin-left:auto; color:var(--muted); font-size:.85rem; }
  #conn { width:10px; height:10px; border-radius:50%; background:#999; display:inline-block; }
  #conn.on { background:var(--ok); }
  nav.tabs { display:none; background:var(--card); border-bottom:1px solid var(--line); }
  nav.tabs button { flex:1; padding:10px; border:0; background:transparent; color:var(--muted); font-size:1rem; border-bottom:3px solid transparent; }
  nav.tabs button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
  .panes { flex:1; min-height:0; display:grid; grid-template-columns:minmax(260px,1fr) minmax(320px,1.4fr) minmax(260px,1fr); gap:8px; padding:8px; }
  .pane { min-height:0; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .pane > h2 { margin:0; padding:8px 12px; font-size:.95rem; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .pane > h2 .sp { margin-left:auto; font-weight:400; }
  .scroll { flex:1; overflow-y:auto; padding:8px; }
  .cm { padding:5px 6px; border-radius:6px; word-break:break-word; }
  .cm.hit { background:var(--chip); }
  .cm b { margin-right:6px; }
  .chip { display:inline-block; background:var(--accent); color:#fff; border-radius:5px; padding:0 6px; font-weight:800; margin-left:4px; letter-spacing:.3px; }
  .cm .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; align-items:center; }
  .cm .acts .st { font-size:.8rem; color:var(--muted); }
  .cm .acts .st.ok { color:var(--ok); font-weight:700; }
  button.big { padding:8px 16px; font-size:1rem; font-weight:700; }
  .card { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
  .card.full { border-color:var(--warn); }
  .card .top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card .code { font-size:1.6rem; font-weight:900; letter-spacing:1px; }
  .card .price { font-weight:700; }
  .card .left { margin-left:auto; color:var(--muted); font-size:.85rem; }
  .row { display:flex; align-items:center; gap:6px; padding:5px 0; border-top:1px dashed var(--line); flex-wrap:wrap; }
  .row .nm { flex:1; min-width:90px; word-break:break-word; }
  .row .tm { color:var(--muted); font-size:.8rem; }
  .lead .nm { font-weight:800; font-size:1.05rem; }
  .tag { font-size:.75rem; border-radius:5px; padding:1px 6px; color:#fff; background:var(--warn); }
  .tag.ok { background:var(--ok); }
  .tag.lead { background:var(--accent); }
  button { border:0; border-radius:7px; padding:7px 12px; font-size:.9rem; cursor:pointer; background:var(--accent); color:#fff; }
  button.g { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button.ok { background:var(--ok); }
  button.sm { padding:4px 9px; font-size:.8rem; }
  a.btn { display:inline-block; padding:4px 9px; font-size:.8rem; border-radius:7px; background:transparent; color:var(--accent); border:1px solid var(--accent); text-decoration:none; }
  .empty { color:var(--muted); text-align:center; padding:24px 8px; }
  .items { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .items .chip { margin:0; background:var(--text); color:var(--bg); }
  .items .chip.p { background:var(--ok); color:#fff; }
  .sim { border-top:1px solid var(--line); padding:8px; display:grid; grid-template-columns:minmax(0,1fr); gap:6px; background:var(--bg); }
  .sim .r { display:flex; gap:6px; min-width:0; }
  .sim input { flex:1 1 0; width:0; min-width:0; padding:7px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--text); font-size:.9rem; }
  #err { color:#dc2626; padding:0 12px; min-height:0; font-size:.85rem; }
  @media (max-width: 860px) {
    nav.tabs { display:flex; }
    .panes { display:block; padding:8px; overflow:hidden; }
    .pane { display:none; height:100%; }
    .pane.show { display:flex; }
    body { height:100dvh; }
  }
</style></head>
<body>
<header>
  <b>Màn hình live</b><span id="conn" title="Kết nối realtime"></span>
  <a href="/">← Tạo mã & in tem</a>
  <span class="stats" id="stats"></span>
</header>
<div id="err"></div>
<nav class="tabs" id="tabs">
  <button data-p="p1" class="active">Comment</button>
  <button data-p="p2">Bảng mã</button>
  <button data-p="p3">Đơn</button>
</nav>
<div class="panes" id="panes">
  <section class="pane show" id="p1">
    <h2>Comment trực tiếp</h2>
    <div class="scroll" id="comments"></div>
    <div class="sim">
      <div class="r"><input id="sName" style="flex:0 0 28%" placeholder="Tên khách" value="Lan"><input id="sText" placeholder="Nội dung, ví dụ: chốt A123"><button id="sSend">Gửi</button></div>
      <div class="r"><button class="g sm" id="auto">▶ Tự chạy giả lập</button><span class="tm" style="color:var(--muted);font-size:.8rem;align-self:center">Comment giả để thử, chưa nối Facebook</span></div>
    </div>
  </section>
  <section class="pane" id="p2">
    <h2>Bảng mã <span class="sp" id="boardCount"></span></h2>
    <div class="scroll" id="board"></div>
  </section>
  <section class="pane" id="p3">
    <h2>Đơn theo khách <span class="sp"><a class="btn" id="billAll" href="/bill" target="_blank" rel="noopener">In tất cả bill</a></span></h2>
    <div class="scroll" id="orders"></div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => new Intl.NumberFormat('vi-VN').format(n) + 'đ';
const hhmmss = (ts) => new Date(ts).toLocaleTimeString('vi-VN', { hour12:false });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

async function post(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Lỗi');
  return j;
}
const run = (fn) => async () => { $('err').textContent = ''; try { await fn(); } catch (e) { $('err').textContent = e.message; } };

function btn(label, cls, fn) { const b = el('button', cls, label); b.addEventListener('click', run(fn)); return b; }

function renderComments(list) {
  const box = $('comments');
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.replaceChildren();
  if (!list.length) box.append(el('div', 'empty', 'Chưa có comment nào'));
  for (const c of list) {
    const d = el('div', 'cm' + (c.codes.length ? ' hit' : ''));
    d.append(el('b', '', c.name), document.createTextNode(c.text));
    for (const code of c.codes) d.append(el('span', 'chip', code));
    if (c.bids.length) {
      // Nút Chốt ngay tại comment: chốt đúng cho người này
      const acts = el('div', 'acts');
      for (const b of c.bids) {
        if (b.state === 'won') acts.append(el('span', 'st ok', `✓ ${b.code} đã chốt${b.paid ? ' · đã CK' : ''}`));
        else if (b.state === 'dropped') acts.append(el('span', 'st', `${b.code} đã bỏ`));
        else if (b.available > 0) acts.append(btn(`Chốt ${b.code}`, 'big', () => post(`/api/bids/${b.bidId}/win`)));
        else acts.append(el('span', 'st', `${b.code} đã hết`));
      }
      d.append(acts);
    }
    box.append(d);
  }
  if (stick) box.scrollTop = box.scrollHeight;
}

function renderBoard(board) {
  const box = $('board');
  box.replaceChildren();
  $('boardCount').textContent = board.length ? board.length + ' mã' : '';
  if (!board.length) box.append(el('div', 'empty', 'Chưa có ai đặt mã nào'));
  for (const c of board) {
    const card = el('div', 'card' + (c.available <= 0 ? ' full' : ''));
    const top = el('div', 'top');
    top.append(el('span', 'code', c.code), el('span', 'price', fmt(c.price)),
      el('span', 'left', c.available > 0 ? `còn ${c.available}/${c.qty}` : 'đã chốt hết'));
    card.append(top);
    for (const w of c.won) {
      const r = el('div', 'row');
      r.append(el('span', 'nm', w.name), el('span', 'tag' + (w.paid ? ' ok' : ''), w.paid ? 'đã CK' : 'chờ CK'));
      if (!w.paid) r.append(btn('Đã CK', 'ok sm', () => post('/api/customers/' + encodeURIComponent(w.userId) + '/paid', { paid:true })));
      r.append(btn('Hủy, chuyển người kế', 'g sm', () => post(`/api/bids/${w.bidId}/drop`)));
      card.append(r);
    }
    c.waiting.forEach((w, i) => {
      const canWin = c.available > 0;
      const r = el('div', 'row' + (i === 0 && canWin ? ' lead' : ''));
      r.append(el('span', 'nm', w.name), el('span', 'tm', hhmmss(w.ts)));
      if (i === 0 && canWin) r.append(el('span', 'tag lead', 'dẫn đầu'));
      else if (!canWin) r.append(el('span', 'tm', 'chờ #' + (i + 1)));
      if (canWin) r.append(btn('Chốt', 'sm', () => post(`/api/bids/${w.bidId}/win`)));
      r.append(btn('Bỏ', 'g sm', () => post(`/api/bids/${w.bidId}/drop`)));
      card.append(r);
    });
    box.append(card);
  }
}

function renderOrders(orders) {
  const box = $('orders');
  box.replaceChildren();
  if (!orders.length) box.append(el('div', 'empty', 'Chưa chốt đơn nào'));
  for (const o of orders) {
    const card = el('div', 'card');
    const top = el('div', 'top');
    top.append(el('b', '', o.name), el('span', 'left', o.items.length + ' món'));
    card.append(top);
    const items = el('div', 'items');
    for (const i of o.items) items.append(el('span', 'chip' + (i.paid ? ' p' : ''), i.code));
    card.append(items);
    const r = el('div', 'row');
    r.append(el('b', 'nm', fmt(o.total)), el('span', 'tag' + (o.paid ? ' ok' : ''), o.paid ? 'đã CK' : 'chờ CK'));
    r.append(btn(o.paid ? 'Bỏ đã CK' : 'Đã CK', o.paid ? 'g sm' : 'ok sm', () => post('/api/customers/' + encodeURIComponent(o.userId) + '/paid', { paid: !o.paid })));
    const a = el('a', 'btn', 'In bill'); a.href = '/bill?user=' + encodeURIComponent(o.userId); a.target = '_blank'; a.rel = 'noopener';
    r.append(a);
    card.append(r);
    box.append(card);
  }
}

let loading = false, again = false;
async function refresh() {
  if (loading) { again = true; return; }
  loading = true;
  try {
    const s = await (await fetch('/api/live/state')).json();
    renderComments(s.comments); renderBoard(s.board); renderOrders(s.orders);
    $('stats').textContent = `${s.stats.used} mã đã tạo · ${s.comments.length} comment`;
  } finally { loading = false; if (again) { again = false; refresh(); } }
}

// Realtime qua SSE: có thay đổi thì tải lại trạng thái
let timer;
const es = new EventSource('/api/live/stream');
es.onopen = () => { $('conn').classList.add('on'); refresh(); };
es.onerror = () => $('conn').classList.remove('on');
es.onmessage = () => { clearTimeout(timer); timer = setTimeout(refresh, 80); };

// Tabs (điện thoại)
$('tabs').addEventListener('click', (e) => {
  const p = e.target.dataset?.p; if (!p) return;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.p === p));
  document.querySelectorAll('.pane').forEach((x) => x.classList.toggle('show', x.id === p));
});

// Giả lập comment
const send = run(async () => {
  const name = $('sName').value, text = $('sText').value;
  if (!text.trim()) return;
  await post('/api/live/comments', { name, text });
  $('sText').value = '';
});
$('sSend').addEventListener('click', send);
$('sText').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

const NAMES = ['Lan', 'Hoa', 'Mai', 'Trang', 'Linh', 'Thảo', 'Ngọc', 'Hương', 'Yến', 'Nhung', 'Phương', 'Chi'];
const TEXTS = ['chốt {c}', 'lấy {c} nha', '{c}', 'cho em {c}', '{c} {d}', 'đẹp quá', 'ib em ạ', 'có size M ko shop', 'ok'];
let autoTimer = null, codes = [];
$('auto').addEventListener('click', run(async () => {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; $('auto').textContent = '▶ Tự chạy giả lập'; return; }
  codes = (await (await fetch('/api/codes')).json()).map((c) => c.code);
  if (!codes.length) throw new Error('Chưa có mã nào, hãy tạo mã trước');
  $('auto').textContent = '■ Dừng giả lập';
  autoTimer = setInterval(() => {
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    // thiên về một nhóm mã nhỏ để dễ có nhiều người tranh cùng một mã
    const pool = codes.slice(0, Math.min(codes.length, 12));
    const text = pick(TEXTS).replace('{c}', pick(pool)).replace('{d}', pick(pool));
    post('/api/live/comments', { name: pick(NAMES), text }).catch(() => {});
  }, 1500);
}));
</script></body></html>
